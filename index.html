<title>Kanji Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: eine Heftspalte. Genkō-Raster (Kreuzlinien) als Kanji-Feld, Lernkarten, Quiz als fokussierte Einzelfrage. */
:root{
  --bg:#eef2ef; --surface:#fbfcfb; --fg:#16201c; --muted:#56675f; --line:#c9d6cf;
  --grid:#8fae9f; --grid-soft:#c5d6cc; --accent:#2c3f9e; --accent-fg:#ffffff;
  --good:#17794f; --good-bg:#dff2e8; --bad:#b3382c; --bad-bg:#f8e1de; --seen:#b9cdc2;
  --serif:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  --sans:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101714; --surface:#18221e; --fg:#e6eee9; --muted:#9fb1a8; --line:#2b3a34;
    --grid:#4d6b5b; --grid-soft:#2f4439; --accent:#9aa8ff; --accent-fg:#0d1230;
    --good:#5fd39b; --good-bg:#16352a; --bad:#ff8f84; --bad-bg:#3a1f1c; --seen:#38503f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101714; --surface:#18221e; --fg:#e6eee9; --muted:#9fb1a8; --line:#2b3a34;
  --grid:#4d6b5b; --grid-soft:#2f4439; --accent:#9aa8ff; --accent-fg:#0d1230;
  --good:#5fd39b; --good-bg:#16352a; --bad:#ff8f84; --bad-bg:#3a1f1c; --seen:#38503f;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-block:14px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:44rem;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance}
h2{font-size:1.2rem;line-height:1.3}
small{font-size:.8rem;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--serif);font-weight:700;font-size:1.3rem;letter-spacing:.02em}
.brand span{color:var(--accent)}
.btn{font:inherit;font-weight:500;min-height:48px;padding:6px 18px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:hover{border-color:var(--grid)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,.wk:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.quiet{border-color:transparent;background:transparent;min-height:44px;padding-inline:8px;color:var(--muted)}
.btn[disabled]{opacity:.55;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>.btn{flex:1 1 11rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.muted{color:var(--muted)}
.kline{font-family:var(--serif);font-size:1.6rem;letter-spacing:.12em;line-height:1.5;word-break:break-all}
.stats{display:flex;flex-wrap:wrap;gap:20px}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{font-size:.8rem;color:var(--muted)}
.sect{display:flex;flex-direction:column;gap:10px}
.sect>h2{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:10px}
.wk{font:inherit;color:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.wk:hover{border-color:var(--grid)}
.wk b{font-size:1.05rem}
.wk small{font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--seen)}
.bar i+i{background:var(--good)}
.kana-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:10px}
.kset{font:inherit;color:inherit;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:60px}
.kset:hover{border-color:var(--grid)}
.kset b{font-weight:700}
.dayrow{display:flex;flex-direction:column;gap:10px}
.dayrow .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.dayrow .head b{font-size:1rem}
.kcell{width:100%;aspect-ratio:1;display:grid;place-items:center;font-family:var(--serif);font-size:3rem;line-height:1;font-weight:500;
  border:1.5px solid var(--grid);border-radius:2px;
  background-image:linear-gradient(var(--grid-soft),var(--grid-soft)),linear-gradient(var(--grid-soft),var(--grid-soft));
  background-size:1px 100%,100% 1px;background-position:center,center;background-repeat:no-repeat}
.kcell.big{width:8.5rem;font-size:5.4rem;margin-inline:auto}
.entries{display:flex;flex-direction:column;gap:10px}
.entry{display:grid;grid-template-columns:5rem minmax(0,1fr);gap:14px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.entry .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.entry h3{font-size:1.1rem;line-height:1.3}
.line{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.tag{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:2rem}
.rd{display:inline-flex;gap:6px;align-items:baseline}
.rd>span{font-size:1.05rem}
.none{font-size:.85rem;color:var(--muted)}
.word{border-top:1px dashed var(--line);padding-top:8px;line-height:1.5}
.word .w{font-family:var(--serif);font-size:1.3rem;font-weight:700;margin-right:6px}
.word em{font-style:normal}
details.help{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.help summary{cursor:pointer;font-weight:500;min-height:32px;display:flex;align-items:center}
details.help p{margin-top:8px}
.qhead{display:flex;align-items:center;gap:12px}
.meter{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.qnum{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;min-width:3.2rem;text-align:right}
.qcard{gap:16px}
.qlabel{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.qask{font-size:1.25rem}
.stim{display:flex;justify-content:center}
.stim .word-big{font-family:var(--serif);font-size:3rem;font-weight:700;line-height:1.2;text-align:center;word-break:break-all}
.stim .kana-big{font-family:var(--serif);font-size:5rem;line-height:1.1}
.stim .rom-big{font-size:3.4rem;font-weight:700;line-height:1.1}
.hint{text-align:center}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opts.kan,.opts.kana{grid-template-columns:1fr 1fr}
.opt{font:inherit;color:var(--fg);width:100%;min-height:56px;padding:10px 14px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;
  cursor:pointer;display:flex;align-items:center;gap:12px;text-align:left}
.opt:hover:not([disabled]){border-color:var(--grid)}
.opt .key{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;min-width:1.4rem;text-align:center;flex:none}
.opt .txt{display:flex;flex-direction:column;min-width:0}
.opts.kan .opt,.opts.kana .opt{justify-content:center}
.opts.kan .txt{font-family:var(--serif);font-size:2.2rem;line-height:1.2}
.opts.kana .txt{font-family:var(--serif);font-size:2rem;line-height:1.2;align-items:center}
.opts.kan .key,.opts.kana .key{display:none}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.typed{display:flex;gap:10px}
.typed input{flex:1;min-width:0;min-height:52px;font:inherit;font-size:1.2rem;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
.fb{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.fb.good{background:var(--good-bg)}
.fb.bad{background:var(--bad-bg)}
.fb strong{font-size:1.05rem}
.fb.good strong{color:var(--good)}
.fb.bad strong{color:var(--bad)}
.fb .entry{background:var(--surface)}
.kinfo{display:flex;align-items:center;gap:14px}
.kinfo .kcell{width:4.4rem;font-size:2.4rem}
.score{font-size:3.2rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.wronglist{display:flex;flex-direction:column;gap:8px}
.wronglist .it{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.wronglist .it .k{font-family:var(--serif);font-size:1.8rem;min-width:2.6rem;text-align:center}
@media (max-width:420px){
  .entry{grid-template-columns:4rem minmax(0,1fr);gap:10px;padding:12px}
  .entry .kcell{font-size:2.3rem}
  .kcell.big{width:7rem;font-size:4.4rem}
  .stim .word-big{font-size:2.4rem}
}
@media (min-width:560px){
  .opts:not(.kan):not(.kana){grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:no-preference){
  .meter i{transition:width .25s ease}
}
</style>

function r2h(s){var o='';for(var i=0;i<s.length;){var c=s[i];
  if(c==="'"){i++;continue}
  if(c==='-'){o+='ー';i++;continue}

function rec(e,ok){var o=S.st[e.n]||(S.st[e.n]={b:0,d:dayNum(),s:1,o:0,x:0});o.s=1;if(ok){o.o++;o.b=Math.min(5,o.b+1)}else{o.x++;o.b=0}o.d=dayNum()+INT[o.b];save()}
function dueList(){var t=dayNum();return K.filter(function(e){var s=S.st[e.n];return s&&s.s&&s.d<=t}).sort(function(a,b){return S.st[a.n].b-S.st[b.n].b})}
function wrongList(){return K.filter(function(e){var s=S.st[e.n];return s&&s.b===0&&s.x>0})}
function rdHtml(list){return list.length?list.map(function(x){return'<span class="rd"><span lang="ja">'+esc(x)+'</span><small>'+esc(h2r(x))+'</small></span>'}).join(''):'<span class="none">keine übliche Lesung</span>'}
function entryCard(e){return'<article class="entry"><div class="kcell" lang="ja">'+esc(e.k)+'</div><div class="body"><h3>'+esc(e.de)+'</h3>'+
 '<div class="line"><span class="tag">On</span>'+rdHtml(e.on)+'</div><div class="line"><span class="tag">Kun</span>'+rdHtml(e.kun)+'</div>'+
 '<p class="word"><span class="w" lang="ja">'+esc(e.w)+'</span><span lang="ja">'+esc(e.r)+'</span> <small>'+esc(h2r(e.r))+'</small><br><em>'+esc(e.wd)+'</em></p></div></article>'}

/* ---------- Ansichten ---------- */
var V={v:'home'},Q=null;
function topbar(back){return'<div class="top"><span class="brand">漢字 <span>Trainer</span></span>'+(back?'<button class="btn quiet" data-act="'+back.act+'"'+(back.w!=null?' data-w="'+back.w+'"':'')+'>← '+esc(back.t)+'</button>':'')+'</div>'}
function planToday(){var idx=Math.floor((todayUTC()-START)/DAY);if(idx<0)return{phase:'pre'};var w=Math.floor(idx/7);if(w>=20)return{phase:'done'};return{phase:'kanji',w:w,wd:idx%7}}

  else if(p.phase==='done'){t='<h2>Der Plan ist durch</h2><p>Halte die 1500 Kanji mit Wiederholungen frisch.</p><div class="row"><button class="btn primary" data-act="qreview">Wiederholen</button></div>'}
  else if(p.wd<5){t='<h2>Heute: Woche '+(p.w+4)+', '+WDN[p.wd]+'</h2><p class="kline" lang="ja">'+dayEntries(p.w,p.wd).map(function(e){return e.k}).join('')+'</p><div class="row"><button class="btn primary" data-act="day" data-w="'+p.w+'" data-d="'+p.wd+'">Lektion öffnen</button><button class="btn" data-act="qday" data-w="'+p.w+'" data-d="'+p.wd+'">Tagesquiz</button></div>'}
  else if(p.wd===5){t='<h2>Heute: Wochenwiederholung</h2><p>Teste die 75 Kanji aus Woche '+(p.w+4)+'.</p><div class="row"><button class="btn primary" data-act="qweek" data-w="'+p.w+'">Wochentest starten</button><button class="btn" data-act="week" data-w="'+p.w+'">Woche ansehen</button></div>'}
  else{t='<h2>Heute: Puffer</h2><p>Zeit für Fehler und fällige Wiederholungen.</p><div class="row"><button class="btn primary" data-act="qreview">Wiederholen</button><button class="btn" data-act="week" data-w="'+p.w+'">Woche ansehen</button></div>'}
  var seen=K.filter(isSeen).length,strong=K.filter(isStrong).length,due=dueList().length,wr=wrongList().length;
  var h=topbar();
  h+='<section class="panel">'+t+'</section>';
  h+='<section class="panel"><div class="stats"><div><b>'+seen+'</b><span>Kanji gesehen</span></div><div><b>'+strong+'</b><span>Kanji sicher</span></div><div><b>'+due+'</b><span>Wiederholungen fällig</span></div></div>';
  h+='<div class="row"><button class="btn" data-act="qreview"'+(due?'':' disabled')+'>Wiederholen ('+due+')</button><button class="btn" data-act="qwrong"'+(wr?'':' disabled')+'>Fehler üben ('+wr+')</button><button class="btn" data-act="kanaMenu">Kana-Aufgaben</button></div></section>';
  h+='<section class="sect"><h2>Die 20 Kanji-Wochen</h2><div class="weeks">';
  for(var w=0;w<20;w++){var ws=weekEntries(w),se=ws.filter(isSeen).length,st=ws.filter(isStrong).length;
    h+='<button class="wk" data-act="week" data-w="'+w+'"><b>Woche '+(w+4)+'</b><small>ab '+fmtS(START+w*7*DAY)+' · Nr. '+(w*75+1)+' bis '+(w*75+75)+'</small><span class="bar" aria-hidden="true"><i style="width:'+(se/75*100)+'%"></i><i style="width:'+(st/75*100)+'%"></i></span><small>'+st+' sicher · '+se+' gesehen</small></button>'}
  h+='</div></section>';
  h+='<p class="muted"><small>Lesungen und Wörter wurden mit KANJIDIC2 und JMdict abgeglichen (EDRDG, Lizenz CC BY-SA 4.0). Dein Fortschritt wird in diesem Browser gespeichert.</small></p>';
  return h}
function viewWeek(w){

function viewDay(w,d){

  h+='<details class="help"><summary>So liest du die Karten</summary><p><b>Bedeutung</b> steht fett. <b>On</b> ist die Lesung aus dem Chinesischen, sie steht meist in Wörtern aus mehreren Kanji. <b>Kun</b> ist die japanische Lesung, sie steht oft bei einzelnen Kanji mit Hiragana dahinter. Unter jeder Lesung siehst du die Umschrift in lateinischen Buchstaben. Das Beispielwort zeigt, wie das Kanji im Alltag vorkommt.</p></details>';

function viewKana(){
  var h=topbar({act:'home',t:'Start'});
  h+='<section class="panel"><h2>Kana-Aufgaben</h2><p class="muted">Jede Runde hat bis zu 20 Fragen: Zeichen erkennen, Zeichen zur Lesung finden und die Lesung tippen. Falsche Antworten kommen am Ende noch einmal.</p></section>';
  ['Hiragana','Katakana'].forEach(function(g){
    h+='<section class="sect"><h2>'+g+'</h2><div class="kana-grid">';
    KSETS.filter(function(s){return s.g===g}).forEach(function(s){var b=S.kana[s.id];
      h+='<button class="kset" data-act="qkana" data-id="'+s.id+'"><b>'+esc(s.t)+'</b><small>'+s.items.length+' Zeichen'+(b?' · Bestwert '+b.best+' %':'')+'</small></button>'});
    h+='</div></section>'});
  return h}

/* ---------- Fragen bauen ---------- */
function mc(e,pool,get,sim){
  var cv=get(e),c=shuffle(pool).filter(function(x){return x.n!==e.n});if(sim)c=sim(c);
  var seen={};seen[cv]=1;var out=[];
  for(var i=0;i<c.length&&out.length<3;i++){var v=get(c[i]);if(!seen[v]){seen[v]=1;out.push(v)}}
  return shuffle([{v:cv,c:true}].concat(out.map(function(v){return{v:v,c:false}})))}
function mk(t,e,pool){
  var q={t:t,e:e},wordStim='<div class="word-big" lang="ja">'+esc(e.w)+'</div>';
  if(t==='k2d'){q.label='Kanji zur Bedeutung';q.ask='Was bedeutet dieses Kanji?';q.stim='<div class="kcell big" lang="ja">'+esc(e.k)+'</div>';q.opts=mc(e,pool,function(x){return x.de});q.ans=e.de}
  else if(t==='d2k'){q.label='Bedeutung zum Kanji';q.ask='Welches Kanji bedeutet „'+esc(e.de)+'“?';q.stim='';q.opts=mc(e,pool,function(x){return x.k});q.cls='kan';q.ans=e.k}
  else if(t==='w2m'){q.label='Wort verstehen';q.ask='Was bedeutet dieses Wort?';q.stim=wordStim;q.opts=mc(e,pool,function(x){return x.wd});q.ans=e.wd}
  else if(t==='m2w'){q.label='Wort finden';q.ask='Welches Wort heißt „'+esc(e.wd)+'“?';q.stim='';q.opts=mc(e,pool,function(x){return x.w});q.cls='wordopt';q.ans=e.w}
  else if(t==='w2r'){q.label='Lesung wählen';q.ask='Wie liest man dieses Wort?';q.stim=wordStim;
    q.opts=mc(e,pool,function(x){return x.r},function(c){return c.filter(function(x){return norm(x.r)!==norm(e.r)}).sort(function(a,b){return Math.abs(a.r.length-e.r.length)-Math.abs(b.r.length-e.r.length)})});q.ans=e.r;q.kana=true}
  else{q.label='Lesung tippen';q.ask='Wie liest man dieses Wort?';q.stim=wordStim+'';q.typed=true;q.ans=e.r;q.hint='Bedeutung: '+esc(e.wd)+' · '+Array.from(e.r).length+' Kana'}
  return q}
function startKanji(o){
  var list=o.list.slice(),pool=o.pool,qs=[],rec5=['k2d','d2k','w2m','m2w','w2r'];
  if(o.mode==='day'){
    var types=shuffle(rec5.concat(rec5,rec5)),arr=shuffle(list);
    arr.forEach(function(e,i){qs.push(mk(types[i%types.length],e,pool))});
    shuffle(list).slice(0,5).forEach(function(e){qs.push(mk('type',e,pool))})}
  else if(o.mode==='week'){
    var sel=shuffle(list).sort(function(a,b){return(S.st[a.n]?S.st[a.n].b:0)-(S.st[b.n]?S.st[b.n].b:0)}).slice(0,30),ty=shuffle(rec5.concat(rec5,rec5,rec5));
    var rec=[],typed=[];sel=shuffle(sel);
    sel.forEach(function(e,i){if(i%3===2)typed.push(mk('type',e,pool));else rec.push(mk(ty[i%ty.length],e,pool))});
    qs=rec.concat(typed)}
  else{
    var ls=list.slice(0,20);
    ls.forEach(function(e){var b=S.st[e.n]?S.st[e.n].b:0,set=b>=3?['type','w2r']:(b>=2?['m2w','w2r','w2m']:['k2d','d2k','w2m']);qs.push(mk(set[rnd(set.length)],e,pool))});
    qs=shuffle(qs)}
  Q={kind:'kanji',title:o.title,qs:qs,i:0,score:0,first:0,n0:qs.length,wrong:[],answered:false,opts:o,back:o.back};
  V={v:'quiz'};render()}
function startKana(setId){
  var set=KSETS.filter(function(s){return s.id===setId})[0],items=set.items,n=Math.min(20,items.length),pick=shuffle(items).slice(0,n),qs=[];
  var canType=!set.notype;
  pick.forEach(function(it,i){
    var dupe=items.filter(function(x){return x[1]===it[1]}).length>1;
    var t;if(canType&&i>=n-Math.round(n/4))t='typek';else t=(i%2===0||dupe)?'k2r':'r2k';
    if(set.mixed&&t==='typek'&&K_FOR.some(function(f){return f[0]===it[0]}))t='k2r';
    qs.push(mkKana(t,it,items))});
  Q={kind:'kana',title:set.t,qs:qs,i:0,score:0,first:0,n0:qs.length,wrong:[],answered:false,opts:{id:setId},back:function(){V={v:'kana'};render()}};
  V={v:'quiz'};render()}
function mkKana(t,it,items){
  var q={t:t,e:{k:it[0],r:it[1],kana:true},ans:t==='r2k'?it[0]:it[1]};
  var others=shuffle(items).filter(function(x){return x[1]!==it[1]&&x[0]!==it[0]});
  if(t==='k2r'){q.label='Zeichen zur Lesung';q.ask='Wie liest man dieses Zeichen?';q.stim='<div class="kana-big" lang="ja">'+esc(it[0])+'</div>';
    var seen={};seen[it[1]]=1;var o=[];others.forEach(function(x){if(!seen[x[1]]&&o.length<3){seen[x[1]]=1;o.push(x[1])}});
    q.opts=shuffle([{v:it[1],c:true}].concat(o.map(function(v){return{v:v,c:false}})))}
  else if(t==='r2k'){q.label='Lesung zum Zeichen';q.ask='Welches Zeichen liest man so?';q.stim='<div class="rom-big">'+esc(it[1])+'</div>';q.cls='kana';
    var seen2={};seen2[it[0]]=1;var o2=[];others.forEach(function(x){if(!seen2[x[0]]&&o2.length<3){seen2[x[0]]=1;o2.push(x[0])}});
    q.opts=shuffle([{v:it[0],c:true}].concat(o2.map(function(v){return{v:v,c:false}})))}
  else{q.label='Lesung tippen';q.ask='Schreibe die Lesung in Romaji.';q.stim='<div class="kana-big" lang="ja">'+esc(it[0])+'</div>';q.typed=true;q.hint='z. B. ka, shi, kya'}
  return q}

/* ---------- Quiz ---------- */
function optHtml(q,o,i){
  var st='';if(Q.answered){if(o.c)st=' ok';else if(Q.pick===i)st=' no'}
  var inner;
  if(q.cls==='kan')inner='<span class="txt" lang="ja">'+esc(o.v)+'</span>';
  else if(q.cls==='kana')inner='<span class="txt" lang="ja">'+esc(o.v)+'</span>';
  else if(q.cls==='wordopt')inner='<span class="txt" lang="ja" style="font-family:var(--serif);font-size:1.4rem;font-weight:700">'+esc(o.v)+'</span>';
  else if(q.kana)inner='<span class="txt"><span lang="ja" style="font-size:1.2rem">'+esc(o.v)+'</span><small>'+esc(h2r(o.v))+'</small></span>';
  else inner='<span class="txt">'+esc(o.v)+'</span>';
  return'<button class="opt'+st+'" data-act="ans" data-i="'+i+'"'+(Q.answered?' disabled':'')+'><span class="key">'+(i+1)+'</span>'+inner+'</button>'}
function viewQuiz(){
  var q=Q.qs[Q.i],n=Q.qs.length;
  var h='<div class="qhead"><button class="btn quiet" data-act="quit">Abbrechen</button><div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="'+n+'" aria-valuenow="'+Q.i+'"><i style="width:'+(Q.i/n*100)+'%"></i></div><span class="qnum">'+(Q.i+1)+'/'+n+'</span></div>';
  h+='<section class="panel qcard"><p class="qlabel">'+esc(Q.title)+' · '+q.label+(q.retry?' · zweiter Versuch':'')+'</p><h2 class="qask">'+q.ask+'</h2>';
  if(q.stim)h+='<div class="stim">'+q.stim+'</div>';
  if(q.typed){
    if(q.hint)h+='<p class="hint muted">'+q.hint+'</p>';
    h+='<form id="tf" class="typed" autocomplete="off"><input id="ti" name="ti" type="text" enterkeyhint="done" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Deine Antwort" placeholder="'+(Q.kind==='kana'?'Romaji':'Romaji oder Hiragana')+'"'+(Q.answered?' disabled value="'+esc(Q.given)+'"':'')+'><button class="btn primary" type="submit"'+(Q.answered?' disabled':'')+'>Prüfen</button></form>'}
  else h+='<div class="opts '+(q.cls==='kan'||q.cls==='kana'?q.cls:'')+'">'+q.opts.map(function(o,i){return optHtml(q,o,i)}).join('')+'</div>';
  if(Q.answered){h+='<div id="fb">'+Q.fb+'</div><button class="btn primary" id="nx" data-act="next">'+(Q.i+1>=Q.qs.length?'Ergebnis ansehen':'Weiter')+'</button>'}
  h+='</section>';
  return h}
function fbHtml(q,ok,given){
  var h='<div class="fb '+(ok?'good':'bad')+'" role="status"><strong>'+(ok?'Richtig':'Nicht ganz')+'</strong>';
  if(q.e.kana){h+='<div class="kinfo"><div class="kcell" lang="ja">'+esc(q.e.k)+'</div><div><b>'+esc(q.e.r)+'</b></div></div>';
    if(!ok&&q.typed)h+='<p>Du hast geschrieben: „'+esc(given)+'“</p>'}
  else{
    if(!ok){h+='<p>'+(q.typed?'Du hast geschrieben: „'+esc(given)+'“. ':'')+'Richtig ist: <b lang="ja">'+esc(q.ans)+'</b>'+(q.t==='w2r'||q.typed?' ('+esc(h2r(q.ans))+')':'')+'</p>'}
    h+=entryCard(q.e)}
  return h+'</div>'}
function finish(q,ok,pick,given){
  Q.answered=true;Q.pick=pick;Q.given=given||'';
  if(!q.retry){Q.first++;if(ok)Q.score++;else{if(Q.wrong.indexOf(q.e)<0)Q.wrong.push(q.e);var c=Object.assign({},q,{retry:true});if(q.opts)c.opts=shuffle(q.opts);Q.qs.push(c)}
    if(Q.kind==='kanji')rec(q.e,ok)}
  Q.fb=fbHtml(q,ok,given);
  render(true);
  var nx=document.getElementById('nx');if(nx){nx.focus({preventScroll:true});nx.scrollIntoView({block:'nearest'})}}
function answer(i){if(!Q||Q.answered)return;var q=Q.qs[Q.i];if(!q.opts||!q.opts[i])return;finish(q,!!q.opts[i].c,i)}
function answerTyped(txt){if(!Q||Q.answered)return;var q=Q.qs[Q.i];var ok=norm(txt)!==''&&norm(txt)===norm(q.e.kana?q.e.k:q.ans);finish(q,ok,-1,txt)}
function next(){if(!Q||!Q.answered)return;Q.i++;Q.answered=false;Q.fb='';Q.given='';if(Q.i>=Q.qs.length){
    if(Q.kind==='kana'){var p=Math.round(Q.score/Q.n0*100),b=S.kana[Q.opts.id];S.kana[Q.opts.id]={best:Math.max(p,b?b.best:0),last:p};save()}
    V={v:'result'}}
  render()}
function viewResult(){
  var p=Math.round(Q.score/Q.n0*100),msg=p>=90?'Sehr stark. Das sitzt.':p>=70?'Gut. Ein paar Kanji brauchen noch Wiederholung.':'Noch wackelig. Schau dir die Karten unten an und versuche es noch einmal.';
  var h=topbar();
  h+='<section class="panel"><p class="qlabel">'+esc(Q.title)+'</p><p class="score">'+Q.score+' von '+Q.n0+'</p><p>'+msg+'</p></section>';
  if(Q.wrong.length){h+='<section class="panel"><h2>Das war noch nicht sicher</h2>';
    if(Q.kind==='kana')h+='<div class="wronglist">'+Q.wrong.map(function(e){return'<div class="it"><span class="k" lang="ja">'+esc(e.k)+'</span><b>'+esc(e.r)+'</b></div>'}).join('')+'</div>';
    else h+='<div class="entries">'+Q.wrong.map(entryCard).join('')+'</div>';
    h+='</section>'}
  h+='<div class="row"><button class="btn primary" data-act="again">Nochmal</button>'+(Q.kind==='kanji'&&Q.wrong.length?'<button class="btn" data-act="wrongq">Fehler üben</button>':'')+'<button class="btn" data-act="quit">Zurück</button></div>';
  return h}

/* ---------- Rendern und Steuerung ---------- */
function render(keep){
  var f={home:viewHome,week:function(){return viewWeek(V.w)},day:function(){return viewDay(V.w,V.d)},kana:viewKana,quiz:viewQuiz,result:viewResult}[V.v];
  app.innerHTML=f();if(!keep)window.scrollTo(0,0);
  if(V.v==='quiz'&&Q&&!Q.answered&&Q.qs[Q.i].typed){var ti=document.getElementById('ti');if(ti)ti.focus({preventScroll:true})}}
function go(v){V=v;render()}
function dayTitle(w,d){return'Woche '+(w+4)+', '+WDN[d]}
var acts={
  home:function(){go({v:'home'})},
  week:function(d){go({v:'week',w:+d.w})},
  day:function(d){recSeen(dayEntries(+d.w,+d.d));go({v:'day',w:+d.w,d:+d.d})},
  qday:function(d){var w=+d.w,dd=+d.d;recSeen(dayEntries(w,dd));startKanji({title:dayTitle(w,dd),list:dayEntries(w,dd),pool:weekEntries(w),mode:'day',back:function(){go({v:'day',w:w,d:dd})}})},
  qweek:function(d){var w=+d.w;startKanji({title:'Wochentest '+(w+4),list:weekEntries(w),pool:weekEntries(w),mode:'week',back:function(){go({v:'week',w:w})}})},
  qreview:function(){var l=dueList().slice(0,20);if(l.length)startKanji({title:'Wiederholung',list:l,pool:l.length>=8?K.filter(isSeen):K,mode:'review',back:function(){go({v:'home'})}})},
  qwrong:function(){var l=shuffle(wrongList()).slice(0,20);if(l.length)startKanji({title:'Fehler üben',list:l,pool:K.filter(isSeen).length>=8?K.filter(isSeen):K,mode:'review',back:function(){go({v:'home'})}})},
  kanaMenu:function(){go({v:'kana'})},
  qkana:function(d){startKana(d.id)},
  ans:function(d){answer(+d.i)},
  next:function(){next()},
  quit:function(){var b=Q&&Q.back;Q=null;if(b)b();else go({v:'home'})},

};

  if(V.v!=='quiz'||!Q||e.ctrlKey||e.metaKey||e.altKey)return;
  var t=document.activeElement&&document.activeElement.tagName;
  if(!Q.answered&&/^[1-4]$/.test(e.key)&&t!=='INPUT'){answer(+e.key-1)}
